name: Complete G5 evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Evidence slice to execute before the final full gate
        required: true
        default: full
        type: choice
        options:
          - full
          - attachments
          - providers
          - reconciliation
          - state-sync
          - recovery
          - slo

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: g5-evidence-preview
  cancel-in-progress: false

jobs:
  g5-evidence:
    name: Run browser, Preview, provider, SLO and recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: g5-preview
    env:
      CI: true
      G5_EVIDENCE_SCOPE: ${{ inputs.scope || 'full' }}
      GH_TOKEN: ${{ github.token }}
      Y7_GITHUB_VERIFICATION_TOKEN: ${{ secrets.Y7_GITHUB_VERIFICATION_TOKEN }}
      Y7_GITLAB_VERIFICATION_TOKEN: ${{ secrets.Y7_GITLAB_VERIFICATION_TOKEN }}
      Y7_PREVIEW_EVIDENCE_ENV: ${{ secrets.Y7_PREVIEW_EVIDENCE_ENV }}
      ANTIVIRUS_SCANNER_ENDPOINT: ${{ vars.ANTIVIRUS_SCANNER_ENDPOINT }}
      ANTIVIRUS_SCANNER_KEY_ID: ${{ vars.ANTIVIRUS_SCANNER_KEY_ID }}
      ANTIVIRUS_SCANNER_HMAC_KEY: ${{ secrets.ANTIVIRUS_SCANNER_HMAC_KEY }}
      ANTIVIRUS_SCANNER_TIMEOUT_MS: ${{ vars.ANTIVIRUS_SCANNER_TIMEOUT_MS }}
      AZURE_RECOVERY_ACCOUNT_URL: ${{ vars.AZURE_RECOVERY_ACCOUNT_URL }}
      AZURE_RECOVERY_CONTAINER: ${{ vars.AZURE_RECOVERY_CONTAINER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Authenticate the isolated recovery drill with Azure workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_RECOVERY_DRILL_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and browser dependencies
        run: pnpm --filter @y7-feedback/web exec playwright install --with-deps chromium
      - name: Run the complete destructive G5 evidence matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          install -m 600 /dev/null .env.appwrite-preview
          trap 'rm -f .env.appwrite-preview' EXIT
          if [ -z "$Y7_PREVIEW_EVIDENCE_ENV" ]; then
            echo '{"error":"G5_PREVIEW_EVIDENCE_ENV_MISSING"}' >&2
            exit 1
          fi
          if [ -z "$ANTIVIRUS_SCANNER_ENDPOINT" ] || \
             [ -z "$ANTIVIRUS_SCANNER_KEY_ID" ] || \
             [ -z "$ANTIVIRUS_SCANNER_HMAC_KEY" ] || \
             [ -z "$ANTIVIRUS_SCANNER_TIMEOUT_MS" ]; then
            echo '{"error":"G5_PREVIEW_ANTIVIRUS_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          PROVIDER_OUTBOX_TRIGGER_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          printf '%s\n' "$Y7_PREVIEW_EVIDENCE_ENV" > .env.appwrite-preview
          unset Y7_PREVIEW_EVIDENCE_ENV
          printf '\nRELEASE=%s\nPROVIDER_OUTBOX_TRIGGER_SECRET=%s\nANTIVIRUS_SCANNER_ENDPOINT=%s\nANTIVIRUS_SCANNER_KEY_ID=%s\nANTIVIRUS_SCANNER_HMAC_KEY=%s\nANTIVIRUS_SCANNER_TIMEOUT_MS=%s\n' \
            "$GITHUB_SHA" \
            "$PROVIDER_OUTBOX_TRIGGER_SECRET" \
            "$ANTIVIRUS_SCANNER_ENDPOINT" \
            "$ANTIVIRUS_SCANNER_KEY_ID" \
            "$ANTIVIRUS_SCANNER_HMAC_KEY" \
            "$ANTIVIRUS_SCANNER_TIMEOUT_MS" \
            >> .env.appwrite-preview
          unset PROVIDER_OUTBOX_TRIGGER_SECRET
          unset ANTIVIRUS_SCANNER_HMAC_KEY
          pnpm provision:appwrite
          pnpm configure:appwrite:function:preview
          pnpm deploy:appwrite:function:preview
          case "$G5_EVIDENCE_SCOPE" in
            full) pnpm verify:e2e:g5 ;;
            attachments) pnpm verify:appwrite:g2:attachments ;;
            providers)
              pnpm verify:providers:g4:message-sync:github
              pnpm verify:providers:g4:message-sync:gitlab
              ;;
            reconciliation) pnpm verify:providers:g4:reconciliation ;;
            state-sync) pnpm verify:providers:g4:state-sync ;;
            recovery) pnpm verify:recovery:g5 ;;
            slo) pnpm verify:slo:g5 ;;
            *) echo '{"error":"G5_EVIDENCE_SCOPE_INVALID"}' >&2; exit 1 ;;
          esac
