name: Preview G5 SLO evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slo-g5-preview
  cancel-in-progress: false

jobs:
  slo-g5:
    name: Exercise the declared Preview load envelope
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: g5-preview
    env:
      Y7_PREVIEW_EVIDENCE_ENV: ${{ secrets.Y7_PREVIEW_EVIDENCE_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real Preview SLO evidence matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          install -m 600 /dev/null .env.appwrite-preview
          trap 'rm -f .env.appwrite-preview' EXIT
          if [ -z "$Y7_PREVIEW_EVIDENCE_ENV" ]; then
            echo '{"error":"G5_PREVIEW_EVIDENCE_ENV_MISSING"}' >&2
            exit 1
          fi
          printf '%s\n' "$Y7_PREVIEW_EVIDENCE_ENV" > .env.appwrite-preview
          unset Y7_PREVIEW_EVIDENCE_ENV
          printf '\nRELEASE=%s\n' "$GITHUB_SHA" >> .env.appwrite-preview
          pnpm provision:appwrite
          pnpm configure:appwrite:function:preview
          pnpm deploy:appwrite:function:preview
          pnpm verify:slo:g5
