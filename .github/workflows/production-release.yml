name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Stage, smoke, promote and rehearse rollback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      Y7_PRODUCTION_RELEASE_ENV: ${{ secrets.Y7_PRODUCTION_RELEASE_ENV }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy and prove reversible Production release
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          NEW_WEB_URL=""
          NEW_WEB_DEPLOYMENT_ID=""
          PREVIOUS_WEB_DEPLOYMENT_ID=""
          PREVIOUS_WEB_DEPLOYMENT_TARGET=""
          PREVIOUS_FUNCTION_DEPLOYMENT_ID=""
          RESTORE_PREVIOUS_ON_FAILURE=0
          resolve_vercel_deployment_id() {
            local target="${1#https://}"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$target?teamId=$VERCEL_ORG_ID" |
              node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (typeof value.id !== "string" || !/^dpl_[A-Za-z0-9]+$/.test(value.id))
                    process.exit(1);
                  process.stdout.write(value.id);
                });
              '
          }
          resolve_vercel_deployment_target() {
            local target="${1#https://}"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$target?teamId=$VERCEL_ORG_ID" |
              node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (typeof value.url !== "string" ||
                      !/^[A-Za-z0-9.-]+\.vercel\.app$/.test(value.url))
                    process.exit(1);
                  process.stdout.write(`https://${value.url}`);
                });
              '
          }
          await_vercel_deployment() {
            local target="$1"
            local expected="$2"
            local actual=""
            for _ in $(seq 1 30); do
              actual="$(resolve_vercel_deployment_id "$target")"
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              sleep 2
            done
            echo '{"error":"PRODUCTION_WEB_ROUTING_MISMATCH"}' >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && \
               [ "$RESTORE_PREVIOUS_ON_FAILURE" = "1" ]; then
              if [ -n "$PREVIOUS_WEB_DEPLOYMENT_TARGET" ]; then
                if ! pnpm dlx vercel@50.35.0 promote "$PREVIOUS_WEB_DEPLOYMENT_TARGET" \
                  --yes --token "$VERCEL_TOKEN" >/dev/null; then
                  status=1
                fi
              fi
              if [ -n "$PREVIOUS_FUNCTION_DEPLOYMENT_ID" ] && \
                 [ -f .env.appwrite-production ]; then
                export Y7_PREVIOUS_FUNCTION_DEPLOYMENT_ID="$PREVIOUS_FUNCTION_DEPLOYMENT_ID"
                if ! node --env-file=.env.appwrite-production \
                  functions/api/dist/production-function-rollback.js restore \
                  >/dev/null; then
                  status=1
                fi
                unset Y7_PREVIOUS_FUNCTION_DEPLOYMENT_ID
              fi
            fi
            rm -f .env.appwrite-production .production-web-url
            exit "$status"
          }
          trap cleanup EXIT
          if [ -z "$Y7_PRODUCTION_RELEASE_ENV" ] || [ -z "$VERCEL_TOKEN" ] ||
             [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '{"error":"PRODUCTION_RELEASE_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          install -m 600 /dev/null .env.appwrite-production
          printf '%s\n' "$Y7_PRODUCTION_RELEASE_ENV" > .env.appwrite-production
          unset Y7_PRODUCTION_RELEASE_ENV

          PRODUCTION_WEB_ORIGIN="$(node --env-file=.env.appwrite-production \
            --print 'process.env.Y7_WEB_ORIGIN || ""')"
          PRODUCTION_SCANNER_ORIGIN="$(node --env-file=.env.appwrite-production \
            --print 'process.env.ANTIVIRUS_SCANNER_ENDPOINT || ""')"
          PRODUCTION_GITHUB_EVIDENCE_READY="$(node --env-file=.env.appwrite-production \
            --print 'Boolean(process.env.Y7_GITHUB_VERIFICATION_TOKEN?.trim())')"
          case "$PRODUCTION_WEB_ORIGIN $PRODUCTION_SCANNER_ORIGIN" in
            https://*\ https://*) ;;
            *) echo '{"error":"PRODUCTION_RELEASE_ORIGIN_INVALID"}' >&2; exit 1 ;;
          esac
          if [ "$PRODUCTION_GITHUB_EVIDENCE_READY" != "true" ]; then
            echo '{"error":"PRODUCTION_GITHUB_EVIDENCE_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          PREVIOUS_WEB_DEPLOYMENT_ID="$(
            resolve_vercel_deployment_id "$PRODUCTION_WEB_ORIGIN"
          )"
          PREVIOUS_WEB_DEPLOYMENT_TARGET="$(
            resolve_vercel_deployment_target "$PRODUCTION_WEB_ORIGIN"
          )"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_SCANNER_ORIGIN/health" >/dev/null

          pnpm --filter @y7-feedback/config build
          pnpm --filter @y7-feedback/domain build
          pnpm --filter @y7-feedback/api build
          PREVIOUS_FUNCTION_DEPLOYMENT_ID="$(
            node --env-file=.env.appwrite-production \
              functions/api/dist/production-function-rollback.js capture
          )"
          RESTORE_PREVIOUS_ON_FAILURE=1

          pnpm provision:appwrite:production
          pnpm configure:appwrite:function:production
          pnpm deploy:appwrite:function:production

          pnpm dlx vercel@50.35.0 deploy --prod --skip-domain --yes \
            --token "$VERCEL_TOKEN" >.production-web-url
          NEW_WEB_URL="$(tr -d '\r\n' <.production-web-url)"
          case "$NEW_WEB_URL" in
            https://*.vercel.app) ;;
            *) echo '{"error":"PRODUCTION_STAGED_WEB_URL_INVALID"}' >&2; exit 1 ;;
          esac
          NEW_WEB_DEPLOYMENT_ID="$(resolve_vercel_deployment_id "$NEW_WEB_URL")"
          if [ "$NEW_WEB_DEPLOYMENT_ID" = "$PREVIOUS_WEB_DEPLOYMENT_ID" ]; then
            echo '{"error":"PRODUCTION_STAGED_WEB_NOT_NEW"}' >&2
            exit 1
          fi
          pnpm dlx vercel@50.35.0 curl / --deployment "$NEW_WEB_URL" \
            --token "$VERCEL_TOKEN" --fail --silent --show-error >/dev/null

          pnpm dlx vercel@50.35.0 promote "$NEW_WEB_URL" \
            --yes --token "$VERCEL_TOKEN" >/dev/null
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$NEW_WEB_DEPLOYMENT_ID"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_WEB_ORIGIN/" >/dev/null

          pnpm dlx vercel@50.35.0 rollback --yes \
            --token "$VERCEL_TOKEN" >/dev/null
          pnpm dlx vercel@50.35.0 rollback status \
            --token "$VERCEL_TOKEN" >/dev/null
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$PREVIOUS_WEB_DEPLOYMENT_ID"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_WEB_ORIGIN/" >/dev/null

          pnpm dlx vercel@50.35.0 promote "$NEW_WEB_URL" \
            --yes --token "$VERCEL_TOKEN" >/dev/null
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$NEW_WEB_DEPLOYMENT_ID"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_WEB_ORIGIN/" >/dev/null

          pnpm verify:release:production
          pnpm verify:mail:production
          pnpm verify:providers:production:github
          RESTORE_PREVIOUS_ON_FAILURE=0
          echo '{"result":"PRODUCTION_RELEASE_AND_ROLLBACK_PASSED"}'
