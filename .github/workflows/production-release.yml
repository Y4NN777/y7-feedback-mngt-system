name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Stage, smoke, promote and rehearse rollback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      Y7_PRODUCTION_RELEASE_ENV: ${{ secrets.Y7_PRODUCTION_RELEASE_ENV }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_SCANNER_ENDPOINT: ${{ vars.Y7_PRODUCTION_SCANNER_ENDPOINT }}
      PRODUCTION_SCANNER_KEY_ID: ${{ vars.Y7_PRODUCTION_SCANNER_KEY_ID }}
      PRODUCTION_SCANNER_HMAC_KEY: ${{ secrets.Y7_PRODUCTION_SCANNER_HMAC_KEY }}
      PRODUCTION_SCANNER_TIMEOUT_MS: ${{ vars.Y7_PRODUCTION_SCANNER_TIMEOUT_MS }}
      PRODUCTION_GITHUB_CLIENT_ID: ${{ vars.Y7_PRODUCTION_GITHUB_CLIENT_ID }}
      PRODUCTION_GITHUB_CLIENT_SECRET: ${{ secrets.Y7_PRODUCTION_GITHUB_CLIENT_SECRET }}
      PRODUCTION_GITHUB_CALLBACK_URL: ${{ vars.Y7_PRODUCTION_GITHUB_CALLBACK_URL }}
      PRODUCTION_GITLAB_CLIENT_ID: ${{ vars.Y7_PRODUCTION_GITLAB_CLIENT_ID }}
      PRODUCTION_GITLAB_CLIENT_SECRET: ${{ secrets.Y7_PRODUCTION_GITLAB_CLIENT_SECRET }}
      PRODUCTION_GITLAB_CALLBACK_URL: ${{ vars.Y7_PRODUCTION_GITLAB_CALLBACK_URL }}
      PRODUCTION_GITLAB_ORIGIN: ${{ vars.Y7_PRODUCTION_GITLAB_ORIGIN }}
      PRODUCTION_SMTP_HOST: ${{ vars.Y7_PRODUCTION_SMTP_HOST }}
      PRODUCTION_SMTP_PORT: ${{ vars.Y7_PRODUCTION_SMTP_PORT }}
      PRODUCTION_SMTP_SECURE: ${{ vars.Y7_PRODUCTION_SMTP_SECURE }}
      PRODUCTION_SMTP_USER: ${{ vars.Y7_PRODUCTION_SMTP_USER }}
      PRODUCTION_SMTP_PASSWORD: ${{ secrets.Y7_PRODUCTION_SMTP_PASSWORD }}
      PRODUCTION_EMAIL_FROM: ${{ vars.Y7_PRODUCTION_EMAIL_FROM }}
      PRODUCTION_ABUSE_HMAC_ACTIVE_KEY_ID: ${{ vars.Y7_PRODUCTION_ABUSE_HMAC_ACTIVE_KEY_ID }}
      PRODUCTION_ABUSE_HMAC_KEYS: ${{ secrets.Y7_PRODUCTION_ABUSE_HMAC_KEYS }}
      PRODUCTION_PROVIDER_OUTBOX_TRIGGER_SECRET: ${{ secrets.Y7_PRODUCTION_PROVIDER_OUTBOX_TRIGGER_SECRET }}
      PRODUCTION_GITHUB_VERIFICATION_TOKEN: ${{ secrets.Y7_GITHUB_VERIFICATION_TOKEN }}
      Y7_FUNCTION_DOMAIN_URL: ${{ vars.Y7_FUNCTION_DOMAIN_URL }}
      Y7_PREVIEW_FUNCTION_DOMAIN_URL: ${{ vars.Y7_PREVIEW_FUNCTION_DOMAIN_URL }}
      Y7_PREVIEW_WEB_ORIGIN: ${{ vars.Y7_PREVIEW_WEB_ORIGIN }}
      Y7_PREVIEW_SCANNER_ENDPOINT: ${{ vars.Y7_PREVIEW_SCANNER_ENDPOINT }}
      Y7_PREVIEW_APPWRITE_PROJECT_ID: ${{ vars.Y7_PREVIEW_APPWRITE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy and prove reversible Production release
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          NEW_WEB_URL=""
          NEW_WEB_DEPLOYMENT_ID=""
          PREVIOUS_WEB_DEPLOYMENT_ID=""
          PREVIOUS_WEB_DEPLOYMENT_TARGET=""
          PREVIOUS_FUNCTION_DEPLOYMENT_ID=""
          RESTORE_PREVIOUS_ON_FAILURE=0
          WEB_ROUTING_MUTATED=0
          resolve_vercel_deployment_id() {
            local target="${1#https://}"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$target?teamId=$VERCEL_ORG_ID" |
              node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (typeof value.id !== "string" || !/^dpl_[A-Za-z0-9]+$/.test(value.id))
                    process.exit(1);
                  process.stdout.write(value.id);
                });
              '
          }
          resolve_vercel_deployment_target() {
            local target="${1#https://}"
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$target?teamId=$VERCEL_ORG_ID" |
              node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const value = JSON.parse(body);
                  if (typeof value.url !== "string" ||
                      !/^[A-Za-z0-9.-]+\.vercel\.app$/.test(value.url))
                    process.exit(1);
                  process.stdout.write(`https://${value.url}`);
                });
              '
          }
          await_vercel_deployment() {
            local target="$1"
            local expected="$2"
            local actual=""
            for _ in $(seq 1 30); do
              actual="$(resolve_vercel_deployment_id "$target")"
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              sleep 2
            done
            echo '{"error":"PRODUCTION_WEB_ROUTING_MISMATCH"}' >&2
            return 1
          }
          await_web_release() {
            local origin="$1"
            local expected="$2"
            local actual=""
            for attempt in $(seq 1 30); do
              actual="$(
                curl --fail --silent --show-error --max-time 30 \
                  --header 'Cache-Control: no-cache' \
                  "$origin/index.html?release=$expected&attempt=$attempt" |
                  node -e '
                    let body = "";
                    process.stdin.setEncoding("utf8");
                    process.stdin.on("data", (chunk) => { body += chunk; });
                    process.stdin.on("end", () => {
                      const match = body.match(
                        /<meta name="y7-release" content="([^"]+)" \/>/u,
                      );
                      process.stdout.write(match?.[1] ?? "");
                    });
                  '
              )"
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              sleep 2
            done
            echo '{"error":"PRODUCTION_WEB_RELEASE_CONVERGENCE_TIMEOUT"}' >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && \
               [ "$RESTORE_PREVIOUS_ON_FAILURE" = "1" ]; then
            if [ "$WEB_ROUTING_MUTATED" = "1" ] && \
               [ -n "$PREVIOUS_WEB_DEPLOYMENT_TARGET" ]; then
                if ! pnpm dlx vercel@50.35.0 promote "$PREVIOUS_WEB_DEPLOYMENT_TARGET" \
                  --scope "$VERCEL_ORG_ID" --yes --token "$VERCEL_TOKEN" >/dev/null; then
                  status=1
                fi
              fi
              if [ -n "$PREVIOUS_FUNCTION_DEPLOYMENT_ID" ] && \
                 [ -f .env.appwrite-production ]; then
                export Y7_PREVIOUS_FUNCTION_DEPLOYMENT_ID="$PREVIOUS_FUNCTION_DEPLOYMENT_ID"
                if ! node --env-file=.env.appwrite-production \
                  functions/api/dist/production-function-rollback.js restore \
                  >/dev/null; then
                  status=1
                fi
                unset Y7_PREVIOUS_FUNCTION_DEPLOYMENT_ID
              fi
            fi
            rm -f .env.appwrite-production .production-web-url
            exit "$status"
          }
          trap cleanup EXIT
          if [ -z "$Y7_PRODUCTION_RELEASE_ENV" ] || [ -z "$VERCEL_TOKEN" ] ||
             [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '{"error":"PRODUCTION_RELEASE_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          install -m 600 /dev/null .env.appwrite-production
          printf '%s\n' "$Y7_PRODUCTION_RELEASE_ENV" > .env.appwrite-production
          unset Y7_PRODUCTION_RELEASE_ENV
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const authorities = {
            ANTIVIRUS_SCANNER_ENDPOINT: "PRODUCTION_SCANNER_ENDPOINT",
            ANTIVIRUS_SCANNER_KEY_ID: "PRODUCTION_SCANNER_KEY_ID",
            ANTIVIRUS_SCANNER_HMAC_KEY: "PRODUCTION_SCANNER_HMAC_KEY",
            ANTIVIRUS_SCANNER_TIMEOUT_MS: "PRODUCTION_SCANNER_TIMEOUT_MS",
            GITHUB_APP_CLIENT_ID: "PRODUCTION_GITHUB_CLIENT_ID",
            GITHUB_APP_CLIENT_SECRET: "PRODUCTION_GITHUB_CLIENT_SECRET",
            GITHUB_APP_CALLBACK_URL: "PRODUCTION_GITHUB_CALLBACK_URL",
            GITLAB_OAUTH_CLIENT_ID: "PRODUCTION_GITLAB_CLIENT_ID",
            GITLAB_OAUTH_CLIENT_SECRET: "PRODUCTION_GITLAB_CLIENT_SECRET",
            GITLAB_OAUTH_CALLBACK_URL: "PRODUCTION_GITLAB_CALLBACK_URL",
            GITLAB_OAUTH_ORIGIN: "PRODUCTION_GITLAB_ORIGIN",
            Y7_EMAIL_SMTP_HOST: "PRODUCTION_SMTP_HOST",
            Y7_EMAIL_SMTP_PORT: "PRODUCTION_SMTP_PORT",
            Y7_EMAIL_SMTP_SECURE: "PRODUCTION_SMTP_SECURE",
            Y7_EMAIL_SMTP_USER: "PRODUCTION_SMTP_USER",
            Y7_EMAIL_SMTP_PASSWORD: "PRODUCTION_SMTP_PASSWORD",
            Y7_EMAIL_FROM: "PRODUCTION_EMAIL_FROM",
            ABUSE_HMAC_ACTIVE_KEY_ID: "PRODUCTION_ABUSE_HMAC_ACTIVE_KEY_ID",
            ABUSE_HMAC_KEYS: "PRODUCTION_ABUSE_HMAC_KEYS",
            PROVIDER_OUTBOX_TRIGGER_SECRET:
              "PRODUCTION_PROVIDER_OUTBOX_TRIGGER_SECRET",
            Y7_GITHUB_VERIFICATION_TOKEN:
              "PRODUCTION_GITHUB_VERIFICATION_TOKEN",
          };
          const lines = [];
          for (const [target, source] of Object.entries(authorities)) {
            const value = process.env[source]?.trim();
            if (!value || /[\r\n]/u.test(value)) {
              throw new Error(`PRODUCTION_RELEASE_AUTHORITY_MISSING:${source}`);
            }
            if (target === "ABUSE_HMAC_KEYS") {
              let keyring;
              try {
                keyring = JSON.parse(value);
              } catch {
                throw new Error("PRODUCTION_ABUSE_HMAC_KEYS_JSON_INVALID");
              }
              const normalized = JSON.stringify(keyring);
              if (normalized.includes("'")) {
                throw new Error("PRODUCTION_ABUSE_HMAC_KEYS_FORMAT_INVALID");
              }
              lines.push(`${target}='${normalized}'`);
            } else {
              lines.push(`${target}=${JSON.stringify(value)}`);
            }
            delete process.env[source];
          }
          appendFileSync(".env.appwrite-production", `\n${lines.join("\n")}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
          printf '\nRELEASE=%s\n' "$GITHUB_SHA" >> .env.appwrite-production

          PRODUCTION_WEB_ORIGIN="$(node --env-file=.env.appwrite-production \
            --print 'process.env.Y7_WEB_ORIGIN || ""')"
          PRODUCTION_SCANNER_ORIGIN="$(node --env-file=.env.appwrite-production \
            --print 'process.env.ANTIVIRUS_SCANNER_ENDPOINT || ""')"
          PRODUCTION_GITHUB_EVIDENCE_READY="$(node --env-file=.env.appwrite-production \
            --print 'Boolean(process.env.Y7_GITHUB_VERIFICATION_TOKEN?.trim())')"
          case "$PRODUCTION_WEB_ORIGIN $PRODUCTION_SCANNER_ORIGIN" in
            https://*\ https://*) ;;
            *) echo '{"error":"PRODUCTION_RELEASE_ORIGIN_INVALID"}' >&2; exit 1 ;;
          esac
          if [ "$PRODUCTION_GITHUB_EVIDENCE_READY" != "true" ]; then
            echo '{"error":"PRODUCTION_GITHUB_EVIDENCE_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          PREVIOUS_WEB_DEPLOYMENT_ID="$(
            resolve_vercel_deployment_id "$PRODUCTION_WEB_ORIGIN"
          )"
          PREVIOUS_WEB_DEPLOYMENT_TARGET="$(
            resolve_vercel_deployment_target "$PRODUCTION_WEB_ORIGIN"
          )"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_SCANNER_ORIGIN/health" >/dev/null

          pnpm --filter @y7-feedback/config build
          pnpm --filter @y7-feedback/domain build
          pnpm --filter @y7-feedback/api build
          PREVIOUS_FUNCTION_DEPLOYMENT_ID="$(
            node --env-file=.env.appwrite-production \
              functions/api/dist/production-function-rollback.js capture
          )"
          RESTORE_PREVIOUS_ON_FAILURE=1

          pnpm provision:appwrite:production
          pnpm configure:appwrite:function:production
          pnpm deploy:appwrite:function:production

          pnpm dlx vercel@50.35.0 deploy --prod --skip-domain --yes \
            --scope "$VERCEL_ORG_ID" \
            --build-env VITE_RELEASE="$GITHUB_SHA" \
            --token "$VERCEL_TOKEN" >.production-web-url
          NEW_WEB_URL="$(tr -d '\r\n' <.production-web-url)"
          case "$NEW_WEB_URL" in
            https://*.vercel.app) ;;
            *) echo '{"error":"PRODUCTION_STAGED_WEB_URL_INVALID"}' >&2; exit 1 ;;
          esac
          NEW_WEB_DEPLOYMENT_ID="$(resolve_vercel_deployment_id "$NEW_WEB_URL")"
          if [ "$NEW_WEB_DEPLOYMENT_ID" = "$PREVIOUS_WEB_DEPLOYMENT_ID" ]; then
            echo '{"error":"PRODUCTION_STAGED_WEB_NOT_NEW"}' >&2
            exit 1
          fi
          pnpm dlx vercel@50.35.0 curl / --deployment "$NEW_WEB_URL" \
            --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/dev/null

          pnpm dlx vercel@50.35.0 promote "$NEW_WEB_URL" \
            --scope "$VERCEL_ORG_ID" --yes --token "$VERCEL_TOKEN" >/dev/null
          WEB_ROUTING_MUTATED=1
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$NEW_WEB_DEPLOYMENT_ID"
          await_web_release "$PRODUCTION_WEB_ORIGIN" "$GITHUB_SHA"

          pnpm dlx vercel@50.35.0 promote "$PREVIOUS_WEB_DEPLOYMENT_TARGET" \
            --scope "$VERCEL_ORG_ID" --yes --token "$VERCEL_TOKEN" >/dev/null
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$PREVIOUS_WEB_DEPLOYMENT_ID"
          curl --fail --silent --show-error --max-time 30 \
            "$PRODUCTION_WEB_ORIGIN/" >/dev/null

          pnpm dlx vercel@50.35.0 promote "$NEW_WEB_URL" \
            --scope "$VERCEL_ORG_ID" --yes --token "$VERCEL_TOKEN" >/dev/null
          await_vercel_deployment "$PRODUCTION_WEB_ORIGIN" "$NEW_WEB_DEPLOYMENT_ID"
          await_web_release "$PRODUCTION_WEB_ORIGIN" "$GITHUB_SHA"

          pnpm verify:release:production
          pnpm verify:mail:production
          pnpm verify:providers:production:github
          RESTORE_PREVIOUS_ON_FAILURE=0
          echo '{"result":"PRODUCTION_RELEASE_AND_ROLLBACK_PASSED"}'
