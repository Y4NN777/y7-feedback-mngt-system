name: Isolated recovery drill

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recovery-drill-preview
  cancel-in-progress: false

jobs:
  recovery-drill:
    name: Restore, verify and destroy isolated Preview fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: recovery-restore
    env:
      Y7_ENVIRONMENT: preview
      APPWRITE_ENDPOINT: ${{ vars.Y7_RECOVERY_APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.Y7_RECOVERY_APPWRITE_PROJECT_ID }}
      APPWRITE_FUNCTION_ID: ${{ vars.Y7_RECOVERY_APPWRITE_FUNCTION_ID }}
      APPWRITE_API_KEY: ${{ secrets.Y7_RECOVERY_APPWRITE_API_KEY }}
      AZURE_RECOVERY_ACCOUNT_URL: ${{ vars.AZURE_RECOVERY_ACCOUNT_URL }}
      AZURE_RECOVERY_CONTAINER: ${{ vars.AZURE_RECOVERY_CONTAINER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Authenticate restore reader with Azure workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_RECOVERY_RESTORE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run destructive isolated recovery exercise
        run: pnpm verify:recovery:g5
