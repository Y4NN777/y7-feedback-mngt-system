name: Production antivirus

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production-antivirus
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify permanent scanner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AZURE_RESOURCE_GROUP: rg-y7-feedback-production-cus
      AZURE_LOCATION: centralus
      Y7_SCANNER_KEY_ID: ${{ vars.Y7_PRODUCTION_SCANNER_KEY_ID }}
      Y7_SCANNER_HMAC_KEY: ${{ secrets.Y7_PRODUCTION_SCANNER_HMAC_KEY }}
      AZURE_ACTION_GROUP_ID: ${{ vars.AZURE_PRODUCTION_ACTION_GROUP_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Authenticate with Azure workload identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_PRODUCTION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the immutable scanner gateway
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          IMAGE="ghcr.io/y4nn777/y7-feedback-antivirus:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          unset GHCR_TOKEN
          docker build --file services/antivirus/Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy immutable monitored scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          if [ -z "$Y7_SCANNER_KEY_ID" ] || \
             [ -z "$Y7_SCANNER_HMAC_KEY" ] || \
             [ -z "$AZURE_ACTION_GROUP_ID" ]; then
            echo '{"error":"PRODUCTION_SCANNER_AUTHORITY_MISSING"}' >&2
            exit 1
          fi
          az resource show --ids "$AZURE_ACTION_GROUP_ID" \
            --api-version 2023-01-01 \
            --query id --output tsv >/dev/null
          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --output none
          az deployment group create \
            --name "antivirus-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/production-antivirus.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              gatewayImage="ghcr.io/y4nn777/y7-feedback-antivirus:sha-$GITHUB_SHA" \
              gatewayRelease="$GITHUB_SHA" \
              scannerKeyId="$Y7_SCANNER_KEY_ID" \
              scannerHmacKey="$Y7_SCANNER_HMAC_KEY" \
              actionGroupId="$AZURE_ACTION_GROUP_ID" \
            --output none
      - name: Verify truthful Production readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGIN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ca-y7-antivirus-production \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)"
          if [ -z "$ORIGIN" ]; then
            echo '{"error":"PRODUCTION_SCANNER_ORIGIN_MISSING"}' >&2
            exit 1
          fi
          for attempt in $(seq 1 60); do
            HEALTH="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "https://$ORIGIN/health" || true)"
            if HEALTH="$HEALTH" EXPECTED_RELEASE="$GITHUB_SHA" node --input-type=module <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH ?? "null");
            if (
              health?.status !== "ok" ||
              health?.release !== process.env.EXPECTED_RELEASE
            ) process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo '{"result":"PRODUCTION_SCANNER_READY"}'
              exit 0
            fi
            if [ "$attempt" -lt 60 ]; then sleep 10; fi
          done
          echo '{"error":"PRODUCTION_SCANNER_READINESS_TIMEOUT"}' >&2
          exit 1
      - name: Prove Production alert routing
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          APP_NAME="ca-y7-antivirus-production"
          ALERT_RULE_NAME="${APP_NAME}-no-replica"
          ACTION_GROUP_NAME="${AZURE_ACTION_GROUP_ID##*/}"
          RECEIVER_NAME=""
          RECEIVER_EMAIL=""
          if [[ ! "$ACTION_GROUP_NAME" =~ ^[A-Za-z0-9._()-]{1,260}$ ]]; then
            echo '{"error":"PRODUCTION_ACTION_GROUP_ID_INVALID"}' >&2
            exit 1
          fi
          RECEIVER_NAME="$(az monitor action-group show \
            --name "$ACTION_GROUP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'emailReceivers[0].name' \
            --output tsv)"
          RECEIVER_EMAIL="$(az monitor action-group show \
            --name "$ACTION_GROUP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'emailReceivers[0].emailAddress' \
            --output tsv)"
          if [ -z "$RECEIVER_NAME" ] || [ -z "$RECEIVER_EMAIL" ]; then
            echo '{"error":"PRODUCTION_ALERT_RECEIVER_MISSING"}' >&2
            exit 1
          fi
          if TEST_ERROR="$(az monitor action-group test-notifications create \
            --action-group "$ACTION_GROUP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --alert-type metricstaticthreshold \
            --add-action email "$RECEIVER_NAME" "$RECEIVER_EMAIL" \
              usecommonalertschema \
            --output none 2>&1)"; then
            unset ACTION_GROUP_NAME RECEIVER_NAME RECEIVER_EMAIL TEST_ERROR
            echo '{"result":"PRODUCTION_ALERT_TEST_SUBMITTED"}'
            exit 0
          fi
          if [[ "$TEST_ERROR" != *"Free subscription not supported"* ]]; then
            echo '{"error":"PRODUCTION_ALERT_TEST_REJECTED"}' >&2
            exit 1
          fi

          # Azure Student rejects synthetic Action Group tests. Prove the same
          # route by firing the deployed zero-replica metric alert instead.
          SCANNER_ID="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query id --output tsv)"
          CONTROL_URI="https://management.azure.com${SCANNER_ID}"
          ALERT_ACTION_GROUP_ID="$(az monitor metrics alert show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ALERT_RULE_NAME" \
            --query 'actions[0].actionGroupId' --output tsv)"
          if [ "${ALERT_ACTION_GROUP_ID,,}" != "${AZURE_ACTION_GROUP_ID,,}" ]; then
            echo '{"error":"PRODUCTION_ALERT_ROUTE_MISMATCH"}' >&2
            exit 1
          fi

          ORIGIN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query 'properties.configuration.ingress.fqdn' --output tsv)"
          restore_scanner() {
            az rest --method post \
              --uri "${CONTROL_URI}/start?api-version=2025-07-01" \
              --output none || true
            for attempt in $(seq 1 60); do
              HEALTH="$(curl --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                "https://$ORIGIN/health" || true)"
              if HEALTH="$HEALTH" EXPECTED_RELEASE="$GITHUB_SHA" \
                node --input-type=module <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH ?? "null");
            if (health?.status !== "ok" ||
                health?.release !== process.env.EXPECTED_RELEASE) process.exit(1);
          } catch { process.exit(1); }
          NODE
              then return 0; fi
              if [ "$attempt" -lt 60 ]; then sleep 10; fi
            done
            return 1
          }
          trap restore_scanner EXIT
          DRILL_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          az rest --method post \
            --uri "${CONTROL_URI}/stop?api-version=2025-07-01" \
            --output none
          SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          ALERTS_URI="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/providers/Microsoft.AlertsManagement/alerts?api-version=2019-03-01&timeRange=1h&monitorCondition=Fired&pageCount=100"
          for attempt in $(seq 1 15); do
            ALERT_ID="$(az rest --method get --uri "$ALERTS_URI" \
              --query "value[?properties.essentials.targetResource == '$SCANNER_ID' && properties.essentials.startDateTime >= '$DRILL_STARTED_AT' && contains(properties.essentials.alertRule, '$ALERT_RULE_NAME')].name | [0]" \
              --output tsv)"
            if [ -n "$ALERT_ID" ]; then
              restore_scanner
              trap - EXIT
              unset ACTION_GROUP_NAME RECEIVER_NAME RECEIVER_EMAIL TEST_ERROR
              echo '{"result":"PRODUCTION_REAL_ALERT_FIRED_AND_SCANNER_RESTORED"}'
              exit 0
            fi
            if [ "$attempt" -lt 15 ]; then sleep 60; fi
          done
          echo '{"error":"PRODUCTION_REAL_ALERT_TIMEOUT"}' >&2
          exit 1
